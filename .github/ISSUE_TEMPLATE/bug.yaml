name: Bug Report 🐞
description: Create a report to help us improve
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please include your Hugo version and RainBow commit so we can reproduce the issue.
        Documentation: [RainBow README](https://github.com/czyt/hugo-RainBow#readme).
        - Use [Discussions](https://github.com/czyt/hugo-RainBow/discussions) section if you have a query or doubts or any other relevant question.
        - Search for previous [Issues](https://github.com/czyt/hugo-RainBow/issues)/[Pull Requests](https://github.com/czyt/hugo-RainBow/pulls) if this issue is already reported or fix has been created.
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: A bug happened! Here are the screenshots.. Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      description: How to reproduce this issue. Here are the steps...
      placeholder:  |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: input
    id: hugo_version
    attributes:
      label: Hugo Version
      description: Paste the output of hugo version. Minimum supported version is 0.158.0.
      placeholder: hugo v0.165.0+extended linux/amd64
    validations:
      required: true
  - type: input
    id: rainbow_version
    attributes:
      label: RainBow Version
      description: What version of RainBow are you running?
      placeholder:  |
        Paste the output of git rev-parse HEAD from your theme directory.
    validations:
      required: true
  - type: dropdown
    id: browser_type
    attributes:
      label: What kind of devices are you seeing the problem on?
      multiple: true
      options:
        - Mobile
        - Desktop
    validations:
      required: false
  - type: dropdown
    id: browsers
    attributes:
      label: What browsers are you seeing the problem on?
      multiple: true
      options:
        - Firefox
        - Chrome
        - Safari
        - Microsoft Edge
    validations:
      required: false
  - type: input
    id: browser_version
    attributes:
      label: Browser Version
      description: Please add browser version or enter user agent string (navigator.userAgent)
      placeholder: ex. Google Chrome 86.0
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
    validations:
      required: true
  - type: input
    id: repo_url
    attributes:
      label: Repository/Source Code link where this issue can be reproduced
      description: Please add url of the repository where this issue can be reproduced
      placeholder: https://github.com/<username>/<repo name>
    validations:
      required: false
  - type: checkboxes
    id: checked_docs
    attributes:
      label: Before submitting
      options:
        - label: I checked the RainBow README and existing issues.
          required: true
