{{- /* Render content once so shortcode/render-hook flags are available in the head. */ -}}
{{- $content := .Content -}}
{{- if and .IsPage (.Param "math") -}}{{- .Store.Set "hasKaTeX" true -}}{{- end -}}
{{- partial "katex/assets/css" . -}}

<style>:root { --rainbow-grain: url('{{ "images/rainbow-grain.png" | relURL }}'); }</style>

{{- with site.Params.rainbow.readingFontCSS }}
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="{{ . }}">
{{- end }}
